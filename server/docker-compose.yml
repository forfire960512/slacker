services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slacker
      POSTGRES_PASSWORD: slacker
      POSTGRES_DB: slacker
    ports:
      - "5432:5432"
    volumes:
      - slacker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slacker"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  slacker-postgres-data:
